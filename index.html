<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandemic Erratic</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f7f3eb;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    #terrain {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #topo-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cairn {
      position: absolute;
      width: 48px;
      height: 64px;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.2s ease, filter 0.2s ease;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25));
    }

    .cairn:hover {
      transform: translate(-50%, -100%) scale(1.15);
      filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.35));
    }

    .cairn.dragging {
      opacity: 0.85;
      cursor: grabbing;
      transition: none;
      pointer-events: none;
      filter: none;
    }

    /* Your cairns — warmer, amber-tinted */
    .cairn-mine {
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25)) sepia(0.5) saturate(2) hue-rotate(-20deg);
    }

    .cairn-mine:hover {
      transform: translate(-50%, -100%) scale(1.15);
      filter: drop-shadow(3px 6px 10px rgba(0,0,0,0.35)) sepia(0.5) saturate(2) hue-rotate(-20deg);
    }

    /* Add button — hidden until logged in */
    #add-btn {
      position: fixed;
      bottom: 32px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #5a4a32;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #add-btn:hover { background: rgba(255, 255, 255, 0.55); }

    /* User status area — top right, liquid glass capsule */
    #user-status {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 20;
      font-size: 0.8rem;
      color: #5a4a32;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #user-status button {
      background: transparent;
      border: 1px solid rgba(90, 74, 50, 0.4);
      color: #5a4a32;
      padding: 4px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      transition: background 0.2s, color 0.2s;
    }

    #user-status button:hover {
      background: rgba(90, 74, 50, 0.15);
    }

    /* Cairn dialog */
    #dialog-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #dialog-overlay.visible { display: flex; }

    #dialog {
      background: #f7f3eb;
      border: 1px solid #8b7355;
      border-radius: 6px;
      padding: 28px 32px;
      width: 360px;
      box-shadow: 4px 8px 24px rgba(0,0,0,0.2);
    }

    #dialog h3, #login-dialog h3 {
      font-size: 1.1rem;
      color: #5a4a32;
      margin-bottom: 18px;
      letter-spacing: 0.04em;
    }

    #dialog label, #login-dialog label {
      display: block;
      font-size: 0.8rem;
      color: #8b7355;
      margin-bottom: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #dialog input, #dialog textarea, #login-dialog input,
    #set-password-dialog input, #choose-username-dialog input {
      width: 100%;
      background: #eee8d8;
      border: 1px solid #c4a882;
      border-radius: 3px;
      padding: 8px 10px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      color: #3a3028;
      margin-bottom: 16px;
      resize: none;
    }

    #dialog textarea { height: 90px; }

    .dialog-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .dialog-btns button {
      padding: 8px 20px;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 0.9rem;
    }

    #cancel-btn, #login-cancel-btn {
      background: transparent;
      color: #8b7355;
      border: 1px solid #8b7355;
    }

    #place-btn, #login-submit-btn, #set-password-submit-btn,
    #choose-username-submit-btn, #reset-submit-btn {
      background: #5a4a32;
      color: #f7f3eb;
    }

    #place-btn:hover, #login-submit-btn:hover, #set-password-submit-btn:hover,
    #choose-username-submit-btn:hover, #reset-submit-btn:hover { background: #3a2e1e; }

    /* Login overlay */
    #login-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #login-overlay.visible { display: flex; }

    #login-dialog {
      background: #f7f3eb;
      border: 1px solid #8b7355;
      border-radius: 6px;
      padding: 28px 32px;
      width: 320px;
      box-shadow: 4px 8px 24px rgba(0,0,0,0.2);
    }

    #login-error, #set-password-error {
      font-size: 0.8rem;
      color: #8b3a3a;
      margin-bottom: 12px;
      display: none;
    }

    #login-message, #set-password-message {
      font-size: 0.8rem;
      color: #3a6b3a;
      margin-bottom: 12px;
      display: none;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.75rem;
      color: #8b7355;
      cursor: pointer;
      margin-top: -10px;
      margin-bottom: 16px;
      text-decoration: underline;
      letter-spacing: 0.03em;
    }

    .forgot-link:hover { color: #5a4a32; }

    #reset-view { display: none; }

    /* Set password overlay */
    #set-password-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #set-password-overlay.visible { display: flex; }

    #set-password-dialog {
      background: #f7f3eb;
      border: 1px solid #8b7355;
      border-radius: 6px;
      padding: 28px 32px;
      width: 320px;
      box-shadow: 4px 8px 24px rgba(0,0,0,0.2);
    }

    /* Choose username overlay */
    #choose-username-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }

    #choose-username-overlay.visible { display: flex; }

    #choose-username-dialog {
      background: #f7f3eb;
      border: 1px solid #8b7355;
      border-radius: 6px;
      padding: 28px 32px;
      width: 320px;
      box-shadow: 4px 8px 24px rgba(0,0,0,0.2);
    }

    #choose-username-error {
      font-size: 0.8rem;
      color: #8b3a3a;
      margin-bottom: 12px;
      display: none;
    }

    #choose-username-hint {
      font-size: 0.75rem;
      color: #8b7355;
      margin-top: 0;
      margin-bottom: 16px;
      font-style: italic;
      display: block;
    }

    /* Password field with show/hide toggle */
    .pw-field-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    #set-password-dialog .pw-field-wrap input {
      margin-bottom: 0;
      padding-right: 52px;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #8b7355;
      font-size: 0.75rem;
      font-family: Georgia, serif;
      cursor: pointer;
      padding: 2px 4px;
      letter-spacing: 0.04em;
    }

    .pw-toggle:hover { color: #5a4a32; }

    #set-password-hint {
      font-size: 0.75rem;
      color: #8b7355;
      margin-top: -8px;
      margin-bottom: 14px;
      font-style: italic;
    }

    /* Instruction banner */
    #instruction {
      display: none;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #5a4a32;
      color: #f7f3eb;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      z-index: 20;
      pointer-events: none;
    }

    /* Popup */
    #popup {
      display: none;
      position: absolute;
      background: #f7f3eb;
      border: 1px solid #8b7355;
      border-radius: 4px;
      padding: 20px 24px;
      max-width: 320px;
      box-shadow: 4px 6px 20px rgba(0,0,0,0.15);
      z-index: 10;
    }

    #popup h3 {
      font-size: 1rem;
      color: #5a4a32;
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }

    #popup p {
      font-size: 0.9rem;
      color: #3a3028;
      line-height: 1.6;
      font-style: italic;
    }

    #popup .close {
      position: absolute;
      top: 8px; right: 12px;
      cursor: pointer;
      font-size: 1rem;
      color: #8b7355;
    }

    #popup .close:hover { color: #5a4a32; }
  </style>
</head>
<body>

<div id="terrain">
  <img id="topo-bg" src="Topographapp.jpg" alt="topographic terrain"/>
</div>

<button id="add-btn" title="Place a cairn">+</button>

<!-- User status: populated by updateUI() -->
<div id="user-status"></div>

<!-- Cairn dialog -->
<div id="dialog-overlay">
  <div id="dialog">
    <h3>Leave your mark</h3>
    <label>Title</label>
    <input type="text" id="input-title" placeholder="A name for this place"/>
    <label>What do you want to leave here?</label>
    <textarea id="input-content" placeholder="A poem, a memory, a thought..."></textarea>
    <div class="dialog-btns">
      <button id="cancel-btn">Cancel</button>
      <button id="place-btn">Place cairn</button>
    </div>
  </div>
</div>

<!-- Login overlay -->
<div id="login-overlay">
  <div id="login-dialog">

    <!-- Sign in view -->
    <div id="login-view">
      <h3>Sign in</h3>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com"/>
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••"/>
      <span class="forgot-link" id="forgot-link">Forgot password?</span>
      <div id="login-error"></div>
      <div class="dialog-btns">
        <button id="login-cancel-btn">Cancel</button>
        <button id="login-submit-btn">Sign in</button>
      </div>
    </div>

    <!-- Forgot password view -->
    <div id="reset-view">
      <h3>Reset password</h3>
      <label>Email</label>
      <input type="email" id="reset-email" placeholder="your@email.com"/>
      <div id="login-message"></div>
      <div class="dialog-btns">
        <button id="reset-back-btn">Back</button>
        <button id="reset-submit-btn">Send reset link</button>
      </div>
    </div>

  </div>
</div>

<!-- Set password overlay (invite arrival + password recovery) -->
<div id="set-password-overlay">
  <div id="set-password-dialog">
    <h3 id="set-password-title">Set your password</h3>
    <label>New password</label>
    <div class="pw-field-wrap">
      <input type="password" id="new-password" placeholder="••••••••"/>
      <button type="button" class="pw-toggle" data-target="new-password">Show</button>
    </div>
    <label>Confirm password</label>
    <div class="pw-field-wrap">
      <input type="password" id="confirm-password" placeholder="••••••••"/>
      <button type="button" class="pw-toggle" data-target="confirm-password">Show</button>
    </div>
    <p id="set-password-hint">At least 6 characters.</p>
    <div id="set-password-error"></div>
    <div class="dialog-btns">
      <button id="set-password-submit-btn">Set password</button>
    </div>
  </div>
</div>

<!-- Choose username overlay (new users only) -->
<div id="choose-username-overlay">
  <div id="choose-username-dialog">
    <h3>Choose a username</h3>
    <input type="text" id="username-input" placeholder="e.g. wanderer, stonepiler..."/>
    <p id="choose-username-hint">Letters, numbers, and underscores only.</p>
    <div id="choose-username-error"></div>
    <div class="dialog-btns">
      <button id="choose-username-submit-btn">Save</button>
    </div>
  </div>
</div>

<!-- Instruction -->
<div id="instruction">Drag your cairn to where it belongs, then release</div>

<!-- Popup -->
<div id="popup">
  <span class="close" onclick="closePopup()">&#x2715;</span>
  <h3 id="popup-title"></h3>
  <p id="popup-text"></p>
</div>

<script>
  const SUPABASE_URL = 'https://cbmviwlufimknywjejnr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibXZpd2x1Zmlta255d2plam5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDg2NTAsImV4cCI6MjA4OTAyNDY1MH0.gR_ypDVU_KTjVgPMV-kCKaAYcwvrWAAEYt-8-UxvBJM';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      storage: window.localStorage,
      lock: async (name, acquireTimeout, fn) => fn()  // bypass Web Locks — prevents AbortError on updateUser
    }
  });

  // Read URL hash type before Supabase clears it (e.g. 'invite', 'recovery')
  // Must be `let` so we can clear it after use — prevents re-triggering on subsequent auth events
  let arrivalType = new URLSearchParams(window.location.hash.slice(1)).get('type');
  let settingPassword = false;  // prevents PASSWORD_RECOVERY from re-showing the dialog during updateUser

  // ── State ──────────────────────────────────────────────────────
  let currentUser = null;
  let currentUsername = null;
  let showOthers = true;

  // ── DOM refs ───────────────────────────────────────────────────
  const terrain = document.getElementById('terrain');
  const popup = document.getElementById('popup');
  const popupTitle = document.getElementById('popup-title');
  const popupText = document.getElementById('popup-text');
  const dialogOverlay = document.getElementById('dialog-overlay');
  const loginOverlay = document.getElementById('login-overlay');
  const setPasswordOverlay = document.getElementById('set-password-overlay');
  const instruction = document.getElementById('instruction');
  const addBtn = document.getElementById('add-btn');
  const userStatus = document.getElementById('user-status');

  // ── Auth UI ────────────────────────────────────────────────────
  async function updateUI(user) {
    currentUser = user;

    if (user) {
      // Fetch username from profiles table
      const { data } = await client.from('profiles').select('username').eq('id', user.id).single();
      currentUsername = data?.username ?? null;

      addBtn.style.display = 'flex';
      userStatus.innerHTML = `
        <span>${currentUsername ?? user.email}</span>
        <button id="toggle-others-btn">${showOthers ? 'Hide others' : 'Show others'}</button>
        <button id="signout-btn">Sign out</button>
      `;
      document.getElementById('signout-btn').addEventListener('click', () => {
        client.auth.signOut();
      });
      document.getElementById('toggle-others-btn').addEventListener('click', () => {
        showOthers = !showOthers;
        document.getElementById('toggle-others-btn').textContent = showOthers ? 'Hide others' : 'Show others';
        applyVisibilityFilter();
      });
    } else {
      currentUsername = null;
      addBtn.style.display = 'none';
      userStatus.innerHTML = `<button id="signin-btn">Sign in</button>`;
      document.getElementById('signin-btn').addEventListener('click', () => {
        loginOverlay.classList.add('visible');
      });
    }
  }

  // ── Choose username ────────────────────────────────────────────
  function showChooseUsername() {
    document.getElementById('username-input').value = '';
    document.getElementById('choose-username-error').style.display = 'none';
    document.getElementById('choose-username-overlay').classList.add('visible');
  }

  document.getElementById('choose-username-submit-btn').addEventListener('click', async () => {
    const username = document.getElementById('username-input').value.trim();
    const errorEl = document.getElementById('choose-username-error');
    errorEl.style.display = 'none';

    if (!username) return;

    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      errorEl.textContent = 'Letters, numbers, and underscores only.';
      errorEl.style.display = 'block';
      return;
    }

    const { error } = await client.from('profiles').upsert({ id: currentUser.id, username });
    if (error) {
      errorEl.textContent = error.code === '23505' ? 'That username is taken.' : 'Could not save username. Try again.';
      errorEl.style.display = 'block';
      return;
    }

    currentUsername = username;
    document.getElementById('choose-username-overlay').classList.remove('visible');
    await updateUI(currentUser);
  });

  document.getElementById('login-cancel-btn').addEventListener('click', () => {
    loginOverlay.classList.remove('visible');
    clearLoginForm();
  });

  document.getElementById('login-submit-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';

    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'Invalid email or password.';
      errorEl.style.display = 'block';
    } else {
      loginOverlay.classList.remove('visible');
      clearLoginForm();
    }
  });

  function clearLoginForm() {
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-message').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('reset-view').style.display = 'none';
  }

  // ── Forgot password ────────────────────────────────────────────
  document.getElementById('forgot-link').addEventListener('click', () => {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('reset-view').style.display = 'block';
  });

  document.getElementById('reset-back-btn').addEventListener('click', () => {
    document.getElementById('reset-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('login-message').style.display = 'none';
  });

  document.getElementById('reset-submit-btn').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    const msgEl = document.getElementById('login-message');
    if (!email) return;

    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://pandemicerratic.com'
    });

    if (error) {
      msgEl.style.color = '#8b3a3a';
      msgEl.textContent = error.message || 'Something went wrong. Try again.';
    } else {
      msgEl.style.color = '#3a6b3a';
      msgEl.textContent = 'Check your email for a reset link.';
    }
    msgEl.style.display = 'block';
  });

  // ── Set password (invite + recovery) ──────────────────────────
  function showSetPassword(title) {
    document.getElementById('set-password-title').textContent = title || 'Set your password';
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
    document.getElementById('set-password-error').style.display = 'none';
    // Reset show/hide toggles
    document.getElementById('new-password').type = 'password';
    document.getElementById('confirm-password').type = 'password';
    document.querySelectorAll('.pw-toggle').forEach(btn => btn.textContent = 'Show');
    setPasswordOverlay.classList.add('visible');
  }

  // Show/hide password toggles
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.textContent = isPassword ? 'Hide' : 'Show';
    });
  });

  // Attempt updateUser with one auto-retry on lock contention
  async function attemptUpdatePassword(newPw, attemptsLeft = 2) {
    try {
      return await client.auth.updateUser({ password: newPw });
    } catch (err) {
      if (err.name === 'AbortError' && attemptsLeft > 0) {
        await new Promise(r => setTimeout(r, 600));
        return attemptUpdatePassword(newPw, attemptsLeft - 1);
      }
      return { error: { message: 'Could not set password. Please try again.' } };
    }
  }

  document.getElementById('set-password-submit-btn').addEventListener('click', async () => {
    const newPw = document.getElementById('new-password').value;
    const confirmPw = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('set-password-error');
    errorEl.style.display = 'none';

    if (newPw.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters.';
      errorEl.style.display = 'block';
      return;
    }

    if (newPw !== confirmPw) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.style.display = 'block';
      return;
    }

    settingPassword = true;
    const { error } = await attemptUpdatePassword(newPw);
    if (error) {
      settingPassword = false;  // reset only on error — on success, PASSWORD_RECOVERY fires and resets it
      errorEl.textContent = error.message || 'Could not set password. Try again.';
      errorEl.style.display = 'block';
    } else {
      setPasswordOverlay.classList.remove('visible');
      // Check if this user already has a username — if not, prompt them to choose one
      const { data } = await client.from('profiles').select('username').eq('id', currentUser.id).single();
      if (!data?.username) showChooseUsername();
    }
  });

  // ── Auth state wiring ──────────────────────────────────────────
  // PASSWORD_RECOVERY: user clicked a reset link — show set password dialog.
  // SIGNED_IN + no profile: new invite user — show set password, then username.
  // INITIAL_SESSION + no profile: returning user without username yet — just prompt username.
  // All other events: update UI and reload markers.
  client.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      const wasSettingPassword = settingPassword;
      settingPassword = false;  // reset here, not in the submit handler
      await updateUI(session?.user ?? null);
      if (!wasSettingPassword) showSetPassword('Set your new password');
      return;
    }

    const user = session?.user ?? null;
    await updateUI(user);

    if (user) {
      const { data: profile } = await client
        .from('profiles')
        .select('username')
        .eq('id', user.id)
        .single();

      if (!profile?.username) {
        if (arrivalType === 'invite') {
          // New invite user arriving for the first time — needs password + username
          arrivalType = null;  // consume it so re-fired SIGNED_IN events don't re-trigger this
          showSetPassword('Welcome — please set your password');
        } else {
          // Returning user who skipped username setup (or has no profiles row yet)
          showChooseUsername();
        }
        return;
      }
    }

    document.querySelectorAll('.cairn').forEach(el => el.remove());
    loadMarkers();
  });

  // ── Load existing markers ──────────────────────────────────────
  async function loadMarkers() {
    const { data, error } = await client.from('markers').select('*');
    if (error) { console.error('Error loading markers:', error); return; }
    data.forEach(marker => {
      const isOwner = !!(currentUser && marker.user_id === currentUser.id);
      addCairnToTerrain(marker.x, marker.y, marker.title, marker.content, false, isOwner);
    });
    applyVisibilityFilter();
  }

  function applyVisibilityFilter() {
    document.querySelectorAll('.cairn:not(.cairn-mine):not(.dragging)').forEach(el => {
      el.style.display = showOthers ? '' : 'none';
    });
  }

  function addCairnToTerrain(x, y, title, content, draggable, isOwner) {
    const img = document.createElement('img');
    img.src = 'cairn.svg';
    img.alt = 'cairn marker';
    img.className = 'cairn';
    if (isOwner) img.classList.add('cairn-mine');
    img.style.left = (x * 100) + '%';
    img.style.top = (y * 100) + '%';

    if (draggable) {
      makeDraggable(img, title, content);
    } else {
      img.addEventListener('click', (e) => showPopup(e, title, content));
    }

    terrain.appendChild(img);
    return img;
  }

  // ── Drag to place ──────────────────────────────────────────────
  function makeDraggable(img, title, content) {
    img.classList.add('dragging');
    instruction.style.display = 'block';

    function onMove(e) {
      const rect = terrain.getBoundingClientRect();
      img.style.left = ((e.clientX - rect.left) / rect.width * 100) + '%';
      img.style.top = ((e.clientY - rect.top) / rect.height * 100) + '%';
    }

    async function onUp(e) {
      document.removeEventListener('mousemove', onMove);
      img.classList.remove('dragging');
      img.classList.add('cairn-mine');
      instruction.style.display = 'none';

      const rect = terrain.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;

      img.style.left = (x * 100) + '%';
      img.style.top = (y * 100) + '%';

      const { error } = await client.from('markers').insert({
        x, y, title, content,
        user_id: currentUser.id
      });
      if (error) { console.error('Error saving marker:', error); return; }

      img.addEventListener('click', (ev) => showPopup(ev, title, content));
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp, { once: true });
  }

  // ── Cairn dialog ───────────────────────────────────────────────
  addBtn.addEventListener('click', () => {
    dialogOverlay.classList.add('visible');
  });

  document.getElementById('cancel-btn').addEventListener('click', () => {
    dialogOverlay.classList.remove('visible');
    clearDialog();
  });

  document.getElementById('place-btn').addEventListener('click', () => {
    const title = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();
    if (!title || !content) return;

    dialogOverlay.classList.remove('visible');
    clearDialog();

    addCairnToTerrain(0.5, 0.5, title, content, true, true);
  });

  function clearDialog() {
    document.getElementById('input-title').value = '';
    document.getElementById('input-content').value = '';
  }

  // ── Popup ──────────────────────────────────────────────────────
  function showPopup(e, title, content) {
    popupTitle.textContent = title;
    popupText.textContent = content;
    const pw = 320, ph = 140;
    popup.style.left = Math.min(e.clientX + 16, window.innerWidth - pw - 16) + 'px';
    popup.style.top = Math.max(e.clientY - ph - 16, 16) + 'px';
    popup.style.display = 'block';
    e.stopPropagation();
  }

  function closePopup() { popup.style.display = 'none'; }
  document.addEventListener('click', closePopup);

  // ── Enter key support ──────────────────────────────────────────
  function onEnter(inputEl, btnId) {
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById(btnId).click();
    });
  }

  onEnter(document.getElementById('login-email'),       'login-submit-btn');
  onEnter(document.getElementById('login-password'),    'login-submit-btn');
  onEnter(document.getElementById('reset-email'),       'reset-submit-btn');
  onEnter(document.getElementById('new-password'),      'set-password-submit-btn');
  onEnter(document.getElementById('confirm-password'),  'set-password-submit-btn');
  onEnter(document.getElementById('username-input'),    'choose-username-submit-btn');
  onEnter(document.getElementById('input-title'),       'place-btn');
</script>

</body>
