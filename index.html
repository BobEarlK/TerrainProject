<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandemic Erratic</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="terrain">
  <img id="topo-bg" src="Topographapp.jpg" alt="topographic terrain"/>
</div>

<button id="add-btn" title="Place a cairn">+</button>

<!-- User status: populated by updateUI() -->
<div id="user-status"></div>

<!-- Cairn dialog -->
<div id="dialog-overlay" class="overlay">
  <div id="dialog" class="dialog">
    <h3>Leave your mark</h3>
    <label>Title</label>
    <input type="text" id="input-title" placeholder="A name for this place"/>
    <label>What do you want to leave here?</label>
    <textarea id="input-content" placeholder="A poem, a memory, a thought..."></textarea>
    <div class="dialog-btns">
      <button id="cancel-btn" class="btn-cancel">Cancel</button>
      <button id="place-btn" class="btn-primary">Place cairn</button>
    </div>
  </div>
</div>

<!-- Login overlay -->
<div id="login-overlay" class="overlay">
  <div id="login-dialog" class="dialog">

    <!-- Sign in view -->
    <div id="login-view">
      <h3>Sign in</h3>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="username"/>
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      <span class="forgot-link" id="forgot-link">Forgot password?</span>
      <div id="login-error" class="dialog-error"></div>
      <div class="dialog-btns">
        <button id="login-cancel-btn" class="btn-cancel">Cancel</button>
        <button id="login-submit-btn" class="btn-primary">Sign in</button>
      </div>
    </div>

    <!-- Forgot password view -->
    <div id="reset-view">
      <h3>Reset password</h3>
      <label>Email</label>
      <input type="email" id="reset-email" placeholder="your@email.com"/>
      <div id="login-message" class="dialog-message"></div>
      <div class="dialog-btns">
        <button id="reset-back-btn" class="btn-cancel">Back</button>
        <button id="reset-submit-btn" class="btn-primary">Send reset link</button>
      </div>
    </div>

  </div>
</div>

<!-- Set password overlay (invite arrival + password recovery) -->
<div id="set-password-overlay" class="overlay">
  <div id="set-password-dialog" class="dialog">
    <h3 id="set-password-title">Set your password</h3>
    <label>New password</label>
    <div class="pw-field-wrap">
      <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password"/>
      <button type="button" class="pw-toggle" data-target="new-password">Show</button>
    </div>
    <label>Confirm password</label>
    <div class="pw-field-wrap">
      <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password"/>
      <button type="button" class="pw-toggle" data-target="confirm-password">Show</button>
    </div>
    <p id="set-password-hint" class="hint">At least 6 characters.</p>
    <div id="set-password-error" class="dialog-error"></div>
    <div class="dialog-btns">
      <button id="set-password-submit-btn" class="btn-primary">Set password</button>
    </div>
  </div>
</div>

<!-- Choose username overlay (new users only) -->
<div id="choose-username-overlay" class="overlay">
  <div id="choose-username-dialog" class="dialog">
    <h3>Choose a username</h3>
    <input type="text" id="username-input" placeholder="e.g. wanderer, stonepiler..."/>
    <p id="choose-username-hint" class="hint">Letters, numbers, spaces, and underscores only.</p>
    <div id="choose-username-error" class="dialog-error"></div>
    <div class="dialog-btns">
      <button id="choose-username-submit-btn" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- Instruction -->
<div id="instruction">Drag your cairn to where it belongs, then release</div>

<!-- Popup -->
<div id="popup">
  <span class="close">&#x2715;</span>
  <h3 id="popup-title"></h3>
  <p id="popup-text"></p>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
