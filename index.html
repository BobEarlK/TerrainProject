<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandemic Erratic</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="terrain">
  <img id="topo-bg" src="Topographapp.jpg" alt="topographic terrain"/>
</div>

<button id="add-btn" title="Place a cairn">+</button>

<!-- User status: populated by updateUI() -->
<div id="user-status"></div>

<!-- Cairn dialog -->
<div id="dialog-overlay" class="overlay">
  <div id="dialog" class="dialog">
    <h3>Leave your mark</h3>
    <label>Title</label>
    <input type="text" id="input-title" placeholder="A name for this place"/>
    <label>What do you want to leave here?</label>
    <textarea id="input-content" placeholder="A poem, a memory, a thought..."></textarea>
    <div class="dialog-btns">
      <button id="cancel-btn" class="btn-cancel">Cancel</button>
      <button id="place-btn" class="btn-primary">Place cairn</button>
    </div>
  </div>
</div>

<!-- Login overlay -->
<div id="login-overlay" class="overlay">
  <div id="login-dialog" class="dialog">

    <!-- Sign in view -->
    <div id="login-view">
      <h3>Sign in</h3>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com"/>
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••"/>
      <span class="forgot-link" id="forgot-link">Forgot password?</span>
      <div id="login-error" class="dialog-error"></div>
      <div class="dialog-btns">
        <button id="login-cancel-btn" class="btn-cancel">Cancel</button>
        <button id="login-submit-btn" class="btn-primary">Sign in</button>
      </div>
    </div>

    <!-- Forgot password view -->
    <div id="reset-view">
      <h3>Reset password</h3>
      <label>Email</label>
      <input type="email" id="reset-email" placeholder="your@email.com"/>
      <div id="login-message" class="dialog-message"></div>
      <div class="dialog-btns">
        <button id="reset-back-btn" class="btn-cancel">Back</button>
        <button id="reset-submit-btn" class="btn-primary">Send reset link</button>
      </div>
    </div>

  </div>
</div>

<!-- Set password overlay (invite arrival + password recovery) -->
<div id="set-password-overlay" class="overlay">
  <div id="set-password-dialog" class="dialog">
    <h3 id="set-password-title">Set your password</h3>
    <label>New password</label>
    <div class="pw-field-wrap">
      <input type="password" id="new-password" placeholder="••••••••"/>
      <button type="button" class="pw-toggle" data-target="new-password">Show</button>
    </div>
    <label>Confirm password</label>
    <div class="pw-field-wrap">
      <input type="password" id="confirm-password" placeholder="••••••••"/>
      <button type="button" class="pw-toggle" data-target="confirm-password">Show</button>
    </div>
    <p id="set-password-hint" class="hint">At least 6 characters.</p>
    <div id="set-password-error" class="dialog-error"></div>
    <div class="dialog-btns">
      <button id="set-password-submit-btn" class="btn-primary">Set password</button>
    </div>
  </div>
</div>

<!-- Choose username overlay (new users only) -->
<div id="choose-username-overlay" class="overlay">
  <div id="choose-username-dialog" class="dialog">
    <h3>Choose a username</h3>
    <input type="text" id="username-input" placeholder="e.g. wanderer, stonepiler..."/>
    <p id="choose-username-hint" class="hint">Letters, numbers, spaces, and underscores only.</p>
    <div id="choose-username-error" class="dialog-error"></div>
    <div class="dialog-btns">
      <button id="choose-username-submit-btn" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- Instruction -->
<div id="instruction">Drag your cairn to where it belongs, then release</div>

<!-- Popup -->
<div id="popup">
  <span class="close" onclick="closePopup()">&#x2715;</span>
  <h3 id="popup-title"></h3>
  <p id="popup-text"></p>
</div>

<script>
  const SUPABASE_URL = 'https://cbmviwlufimknywjejnr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibXZpd2x1Zmlta255d2plam5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NDg2NTAsImV4cCI6MjA4OTAyNDY1MH0.gR_ypDVU_KTjVgPMV-kCKaAYcwvrWAAEYt-8-UxvBJM';
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      storage: window.localStorage
      // Note: lock bypass removed 2026-03-19. It fixed AbortError on updateUser but broke
      // token refresh, causing all DB queries to hang on returning visits with expired tokens.
      // updateUser is now fired without await — USER_UPDATED event drives dismissal instead.
      // See AsyncEventMap.md for full explanation.
    }
  });

  // Read URL hash type before Supabase clears it (e.g. 'invite', 'recovery')
  // Must be `let` so we can clear it after use — prevents re-triggering on subsequent auth events
  let arrivalType = new URLSearchParams(window.location.hash.slice(1)).get('type');
  let passwordWasSet = false;  // one-way flag: once set, never show set-password dialog again this session

  // ── State ──────────────────────────────────────────────────────
  let currentUser = null;
  let currentUsername = null;
  let showOthers = true;

  // ── DOM refs ───────────────────────────────────────────────────
  const terrain = document.getElementById('terrain');
  const popup = document.getElementById('popup');
  const popupTitle = document.getElementById('popup-title');
  const popupText = document.getElementById('popup-text');
  const dialogOverlay = document.getElementById('dialog-overlay');
  const loginOverlay = document.getElementById('login-overlay');
  const setPasswordOverlay = document.getElementById('set-password-overlay');
  const instruction = document.getElementById('instruction');
  const addBtn = document.getElementById('add-btn');
  const userStatus = document.getElementById('user-status');

  // ── Auth UI ────────────────────────────────────────────────────
  async function updateUI(user) {
    currentUser = user;

    if (user) {
      // Render immediately with cached username or email — tests and UX see the span right away.
      // The DB query below updates the displayed name once it resolves; it does not gate rendering.
      addBtn.style.display = 'flex';
      userStatus.innerHTML = `
        <span>${currentUsername ?? user.email}</span>
        <button id="toggle-others-btn">${showOthers ? 'All cairns' : 'My cairns'}</button>
        <button id="signout-btn">Sign out</button>
      `;
      document.getElementById('signout-btn').addEventListener('click', async () => {
        client.auth.signOut(); // fire and forget — SIGNED_OUT hangs like updateUser did
        await updateUI(null);  // drive UI update directly from click, don't wait for event
        document.querySelectorAll('.cairn').forEach(el => el.remove());
        loadMarkers();
      });
      document.getElementById('toggle-others-btn').addEventListener('click', () => {
        showOthers = !showOthers;
        document.getElementById('toggle-others-btn').textContent = showOthers ? 'All cairns' : 'My cairns';
        applyVisibilityFilter();
      });

      // Fetch username — updates the span and currentUsername when ready.
      const { data } = await client.from('profiles').select('username').eq('id', user.id).single();
      currentUsername = data?.username ?? null;
      const span = userStatus.querySelector('span');
      if (span) span.textContent = currentUsername ?? user.email;
    } else {
      currentUsername = null;
      addBtn.style.display = 'none';
      userStatus.innerHTML = `<button id="signin-btn">Sign in</button>`;
      document.getElementById('signin-btn').addEventListener('click', () => {
        loginOverlay.classList.add('visible');
      });
    }
  }

  // ── Choose username ────────────────────────────────────────────
  function showChooseUsername() {
    console.log('[ui] showChooseUsername called');
    document.getElementById('username-input').value = '';
    document.getElementById('choose-username-error').style.display = 'none';
    document.getElementById('choose-username-overlay').classList.add('visible');
    console.log('[ui] choose-username overlay visible class added');
  }

  document.getElementById('choose-username-submit-btn').addEventListener('click', async () => {
    const username = document.getElementById('username-input').value.trim();
    const errorEl = document.getElementById('choose-username-error');
    errorEl.style.display = 'none';

    if (!username) {
      errorEl.textContent = 'Please enter a username.';
      errorEl.style.display = 'block';
      return;
    }

    if (!/^[a-zA-Z0-9_ ]+$/.test(username)) {
      errorEl.textContent = 'Letters, numbers, spaces, and underscores only.';
      errorEl.style.display = 'block';
      return;
    }

    const { error } = await client.from('profiles').upsert({ id: currentUser.id, username });
    if (error) {
      errorEl.textContent = error.code === '23505' ? 'That username is taken.' : 'Could not save username. Try again.';
      errorEl.style.display = 'block';
      return;
    }

    currentUsername = username;
    document.getElementById('choose-username-overlay').classList.remove('visible');
    await updateUI(currentUser);
    document.querySelectorAll('.cairn').forEach(el => el.remove());
    loadMarkers();
  });

  document.getElementById('login-cancel-btn').addEventListener('click', () => {
    loginOverlay.classList.remove('visible');
    clearLoginForm();
  });

  document.getElementById('login-submit-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';

    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'Invalid email or password.';
      errorEl.style.display = 'block';
    } else {
      loginOverlay.classList.remove('visible');
      clearLoginForm();
    }
  });

  function clearLoginForm() {
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-message').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('reset-view').style.display = 'none';
  }

  // ── Forgot password ────────────────────────────────────────────
  document.getElementById('forgot-link').addEventListener('click', () => {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('reset-view').style.display = 'block';
  });

  document.getElementById('reset-back-btn').addEventListener('click', () => {
    document.getElementById('reset-view').style.display = 'none';
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('login-message').style.display = 'none';
    const btn = document.getElementById('reset-submit-btn');
    btn.textContent = 'Send reset link';
    btn.onclick = null;
  });

  document.getElementById('reset-submit-btn').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    const msgEl = document.getElementById('login-message');
    if (!email) return;

    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://pandemicerratic.com'
    });

    if (error) {
      msgEl.style.color = '#8b3a3a';
      msgEl.textContent = error.message || 'Something went wrong. Try again.';
      msgEl.style.display = 'block';
    } else {
      msgEl.style.color = '#3a6b3a';
      msgEl.textContent = 'Check your email for a reset link.';
      msgEl.style.display = 'block';
      const btn = document.getElementById('reset-submit-btn');
      btn.textContent = 'Close';
      btn.onclick = () => {
        loginOverlay.classList.remove('visible');
        clearLoginForm();
      };
    }
  });

  // ── Set password (invite + recovery) ──────────────────────────
  function showSetPassword(title) {
    document.getElementById('set-password-title').textContent = title || 'Set your password';
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
    document.getElementById('set-password-error').style.display = 'none';
    // Reset show/hide toggles
    document.getElementById('new-password').type = 'password';
    document.getElementById('confirm-password').type = 'password';
    document.querySelectorAll('.pw-toggle').forEach(btn => btn.textContent = 'Show');
    setPasswordOverlay.classList.add('visible');
  }

  // Show/hide password toggles
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.textContent = isPassword ? 'Hide' : 'Show';
    });
  });

  document.getElementById('set-password-submit-btn').addEventListener('click', () => {
    const newPw = document.getElementById('new-password').value;
    const confirmPw = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('set-password-error');
    errorEl.style.display = 'none';

    if (newPw.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters.';
      errorEl.style.display = 'block';
      return;
    }

    if (newPw !== confirmPw) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.style.display = 'block';
      return;
    }

    // updateUser's promise can hang due to Web Locks — don't await it.
    // Instead, set the flag and let the USER_UPDATED auth event drive dismissal.
    // If the call rejects quickly (before hanging), surface the error.
    console.log('[submit] setting passwordWasSet = true, firing updateUser (not awaited)');
    passwordWasSet = true;
    client.auth.updateUser({ password: newPw }).then(({ error }) => {
      if (error) {
        passwordWasSet = false;
        errorEl.textContent = error.message || 'Could not set password. Try again.';
        errorEl.style.display = 'block';
      }
    });
  });

  // ── Auth state wiring ──────────────────────────────────────────
  // PASSWORD_RECOVERY: user clicked a reset link — show set password dialog.
  // SIGNED_IN + no profile: new invite user — show set password, then username.
  // INITIAL_SESSION + no profile: returning user without username yet — just prompt username.
  // All other events: update UI and reload markers.
  client.auth.onAuthStateChange(async (event, session) => {
    console.log('[auth]', event, '| arrivalType:', arrivalType, '| passwordWasSet:', passwordWasSet, '| user:', session?.user?.email ?? null);

    // Supabase fires both INITIAL_SESSION and SIGNED_IN on authenticated page loads.
    // INITIAL_SESSION is redundant when the user is already signed in — SIGNED_IN will
    // handle the full flow. Skipping it prevents double loadMarkers, double profile checks,
    // and spurious choose-username dialogs. For anonymous users (null session), INITIAL_SESSION
    // is the only event and must be processed normally.
    if (event === 'INITIAL_SESSION' && session?.user) {
      console.log('[auth] INITIAL_SESSION with authenticated user — skipping, deferring to SIGNED_IN');
      return;
    }

    // Password was set — USER_UPDATED fires reliably even when the promise hangs.
    // This is where we dismiss the dialog and move to the next step.
    if (event === 'USER_UPDATED' && passwordWasSet) {
      console.log('[auth] USER_UPDATED with passwordWasSet — dismissing dialog, deferring DB work');
      setPasswordOverlay.classList.remove('visible');
      const user = session?.user ?? null;
      // Defer all DB work — querying inside USER_UPDATED blocks while auth finalises session
      setTimeout(async () => {
        console.log('[follow-up] post-password-set flow starting');
        await updateUI(user);
        if (user) {
          const { data, error: profileErr } = await client.from('profiles').select('username').eq('id', user.id).single();
          console.log('[follow-up] profile check — username:', data?.username ?? null, '| error:', profileErr?.code ?? null);
          if (!data?.username) {
            console.log('[follow-up] calling showChooseUsername');
            showChooseUsername();
          } else {
            console.log('[follow-up] has username, loading markers');
            document.querySelectorAll('.cairn').forEach(el => el.remove());
            loadMarkers();
          }
        }
      }, 100);
      return;
    }

    if (event === 'PASSWORD_RECOVERY') {
      // Not awaited — same lock-reentrancy reason as checkProfileAfterSignIn.
      // updateUI's sync part (setting currentUser, updating innerHTML) runs immediately;
      // the internal username fetch suspends updateUI but not this callback.
      updateUI(session?.user ?? null);
      console.log('[auth] PASSWORD_RECOVERY — passwordWasSet is', passwordWasSet, '— will show dialog?', !passwordWasSet);
      if (!passwordWasSet) showSetPassword('Set your new password');
      return;
    }

    // Close login overlay if it's open — signInWithPassword promise can hang (Web Locks),
    // so we drive dismissal from the auth event rather than the promise's else branch.
    if (event === 'SIGNED_IN' && loginOverlay.classList.contains('visible')) {
      loginOverlay.classList.remove('visible');
      clearLoginForm();
    }

    const user = session?.user ?? null;
    updateUI(user); // not awaited — currentUser is set synchronously as first line of updateUI

    // Load cairns immediately — no reason to wait for profile queries.
    // Ownership tinting is correct because currentUser is already set.
    document.querySelectorAll('.cairn').forEach(el => el.remove());
    loadMarkers();

    // Profile check — must run outside the auth lock context.
    // Supabase holds its internal lock while notifying auth subscribers. Any client.from()
    // call made directly inside this callback tries to re-acquire the same lock → deadlock.
    // Calling checkProfileAfterSignIn() without await breaks out of that context: the
    // function suspends at its own await, control returns here, the callback returns,
    // the lock releases, and the profile fetch can proceed normally.
    if (user) checkProfileAfterSignIn(user);
  });

  async function checkProfileAfterSignIn(user) {
    const { data: profile } = await client
      .from('profiles')
      .select('username')
      .eq('id', user.id)
      .single();

    console.log('[auth] profile username:', profile?.username ?? null, '| arrivalType:', arrivalType);

    if (!profile?.username) {
      if (arrivalType === 'invite') {
        arrivalType = null;
        console.log('[auth] showing set-password (invite path)');
        showSetPassword('Welcome — please set your password');
      } else {
        console.log('[auth] showing choose-username');
        showChooseUsername();
      }
    }
  }

  // ── Load existing markers ──────────────────────────────────────
  async function loadMarkers() {
    const { data, error } = await client.from('markers').select('*');
    if (error) { console.error('Error loading markers:', error); return; }
    console.log('[load] loadMarkers processing', data.length, 'markers, currentUser:', currentUser?.id ?? null);
    // Clear here (not just before calling loadMarkers) so concurrent calls don't duplicate.
    // Both INITIAL_SESSION and SIGNED_IN fire on authenticated page loads, causing two
    // concurrent fetches. Clearing after the await means whichever completes last wins —
    // JS single-thread guarantees the clear+forEach runs atomically, so the result is always
    // one clean set of cairns regardless of call order.
    document.querySelectorAll('.cairn').forEach(el => el.remove());
    data.forEach(marker => {
      const isOwner = !!(currentUser && marker.user_id === currentUser.id);
      addCairnToTerrain(marker.x, marker.y, marker.title, marker.content, false, isOwner);
    });
    applyVisibilityFilter();
  }

  function applyVisibilityFilter() {
    document.querySelectorAll('.cairn:not(.cairn-mine):not(.dragging)').forEach(el => {
      el.style.display = showOthers ? '' : 'none';
    });
  }

  function addCairnToTerrain(x, y, title, content, draggable, isOwner) {
    const img = document.createElement('img');
    img.src = 'cairn.svg';
    img.alt = 'cairn marker';
    img.className = 'cairn';
    if (isOwner) img.classList.add('cairn-mine');
    img.style.left = (x * 100) + '%';
    img.style.top = (y * 100) + '%';

    if (draggable) {
      makeDraggable(img, title, content);
    } else {
      img.addEventListener('click', (e) => showPopup(e, title, content));
    }

    terrain.appendChild(img);
    return img;
  }

  // ── Drag to place ──────────────────────────────────────────────
  function makeDraggable(img, title, content) {
    img.classList.add('dragging');
    instruction.style.display = 'block';

    function onMove(e) {
      const rect = terrain.getBoundingClientRect();
      img.style.left = ((e.clientX - rect.left) / rect.width * 100) + '%';
      img.style.top = ((e.clientY - rect.top) / rect.height * 100) + '%';
    }

    async function onUp(e) {
      document.removeEventListener('mousemove', onMove);
      img.classList.remove('dragging');
      img.classList.add('cairn-mine');
      instruction.style.display = 'none';

      const rect = terrain.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;

      img.style.left = (x * 100) + '%';
      img.style.top = (y * 100) + '%';

      img.addEventListener('click', (ev) => showPopup(ev, title, content));

      const { error } = await client.from('markers').insert({
        x, y, title, content,
        user_id: currentUser.id
      });
      if (error) { console.error('Error saving marker:', error); return; }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp, { once: true });
  }

  // ── Cairn dialog ───────────────────────────────────────────────
  addBtn.addEventListener('click', () => {
    dialogOverlay.classList.add('visible');
  });

  document.getElementById('cancel-btn').addEventListener('click', () => {
    dialogOverlay.classList.remove('visible');
    clearDialog();
  });

  document.getElementById('place-btn').addEventListener('click', () => {
    const title = document.getElementById('input-title').value.trim();
    const content = document.getElementById('input-content').value.trim();
    if (!title || !content) return;

    dialogOverlay.classList.remove('visible');
    clearDialog();

    addCairnToTerrain(0.5, 0.5, title, content, true, true);
  });

  function clearDialog() {
    document.getElementById('input-title').value = '';
    document.getElementById('input-content').value = '';
  }

  // ── Popup ──────────────────────────────────────────────────────
  function showPopup(e, title, content) {
    popupTitle.textContent = title;
    popupText.textContent = content;
    const pw = 320, ph = 140;
    popup.style.left = Math.min(e.clientX + 16, window.innerWidth - pw - 16) + 'px';
    popup.style.top = Math.max(e.clientY - ph - 16, 16) + 'px';
    popup.style.display = 'block';
    e.stopPropagation();
  }

  function closePopup() { popup.style.display = 'none'; }
  document.addEventListener('click', closePopup);

  // ── Enter key support ──────────────────────────────────────────
  function onEnter(inputEl, btnId) {
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById(btnId).click();
    });
  }

  onEnter(document.getElementById('login-email'),       'login-submit-btn');
  onEnter(document.getElementById('login-password'),    'login-submit-btn');
  onEnter(document.getElementById('reset-email'),       'reset-submit-btn');
  onEnter(document.getElementById('new-password'),      'set-password-submit-btn');
  onEnter(document.getElementById('confirm-password'),  'set-password-submit-btn');
  onEnter(document.getElementById('username-input'),    'choose-username-submit-btn');
  onEnter(document.getElementById('input-title'),       'place-btn');

  // Set sign-in button immediately — same reasoning as the raw cairn fetch below.
  // The auth event may be delayed by token refresh; don't make visitors wait for a button.
  // updateUI() will replace this with the correct logged-in state once auth settles.
  userStatus.innerHTML = `<button id="signin-btn">Sign in</button>`;
  document.getElementById('signin-btn').addEventListener('click', () => {
    loginOverlay.classList.add('visible');
  });

  // Raw fetch removed — it was a workaround for the Supabase Web Locks deadlock that
  // caused all client DB calls to hang. Now that the deadlock is fixed (auth callbacks
  // no longer directly await client.from()), loadMarkers() works correctly for both
  // authenticated and anonymous users. INITIAL_SESSION fires for anonymous visitors
  // and routes through the same loadMarkers() call, so the raw fetch is obsolete.

  // Expose helpers and state for Playwright tests
  window.showSetPassword = showSetPassword;
  window.showChooseUsername = showChooseUsername;
  Object.defineProperty(window, 'currentUser', { get: () => currentUser });
</script>

</body>
</html>
